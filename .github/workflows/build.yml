name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS app (.dmg)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0 # keep in sync with rust-toolchain.toml
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Core tests on macOS
        run: cargo test -p mrclean-core
      - name: Build universal app (Apple Silicon + Intel)
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - uses: actions/upload-artifact@v7
        with:
          name: Mr.Clean-macOS
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-linux:
    name: Build Linux app (.deb, .AppImage)
    # The oldest Ubuntu with WebKitGTK 4.1, so the app runs on 22.04 and newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf libfuse2 file
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Core tests on Linux
        run: cargo test -p mrclean-core
      - name: Build .deb and .AppImage
        run: npx tauri build --bundles deb,appimage
      # Separate downloads: the .deb is small; the AppImage bundles its own
      # WebKitGTK/GTK so it runs on any distro, which makes it ~10x bigger.
      - uses: actions/upload-artifact@v7
        with:
          name: Mr.Clean-Linux-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Mr.Clean-Linux-AppImage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-windows:
    name: Build Windows app (.msi, .exe)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Core tests on Windows
        run: cargo test -p mrclean-core
      - name: Build installers
        run: npx tauri build --bundles msi,nsis
      - uses: actions/upload-artifact@v7
        with:
          name: Mr.Clean-Windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # One job publishes everything once all three builds pass (v* tags only).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload the installers
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-release
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Mr.Clean ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ### Which file do I download?

            | Your computer | File |
            |---|---|
            | Mac (Apple Silicon or Intel) | `Mr.Clean_*_universal.dmg` |
            | Windows 10/11 | `Mr.Clean_*_x64-setup.exe` (or the `.msi`) |
            | Ubuntu / Debian | `Mr.Clean_*_amd64.deb` |
            | Other Linux | `Mr.Clean_*_amd64.AppImage` (bigger: it brings its own web engine) |

            The apps aren't code-signed yet. On a Mac, right-click the app → **Open** the first time. On Windows, click **More info → Run anyway**.
          files: |
            dist-release/Mr.Clean-macOS/*.dmg
            dist-release/Mr.Clean-Windows/*.exe
            dist-release/Mr.Clean-Windows/*.msi
            dist-release/Mr.Clean-Linux-deb/*.deb
            dist-release/Mr.Clean-Linux-AppImage/*.AppImage
          fail_on_unmatched_files: true
