# cargo-deny: checked in CI on every pull request (see .github/workflows/security.yml).

[graph]
all-features = false

[advisories]
# Known-vulnerable crates fail the build. Unmaintained crates deep in Tauri's
# Linux GTK stack are reported but only fail if we depend on them directly.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Licences compatible with shipping inside a GPL-3.0 app.
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "0BSD", "CC0-1.0", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "BSL-1.0",
  "GPL-3.0", "GPL-3.0-or-later", "LGPL-2.1-or-later", "CDLA-Permissive-2.0", "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
